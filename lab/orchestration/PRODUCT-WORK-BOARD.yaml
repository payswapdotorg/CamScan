dispatch_rules:
  - One worker packet is one bounded work order.
  - Workers may work concurrently when paths are disjoint.
  - Shared domain changes require a lead-owned contract commit first.
  - Workers never declare parity acceptance.
  - Live reference execution remains lead-controlled.
  - Every accepted feature requires current evidence and a ledger PASS.
  - Android Studio is never a worker dependency.
  - E2B is the current substrate; camera_fixture=false remains honest until a deterministic camera fixture is empirically proven.
  - "TRANSIT-CORRUPTION PROTOCOL (2026-09-28, gate-2 evidence): the chat renderer eats '$' in string templates (math delimiters), halves double backslashes, mangles multi-line KDoc closers (*/ -> /), and can eat closing braces. Workers delivering code in chat MUST: (a) write every '$' in a string template as ${'$'} (Kotlin-valid, transit-safe), (b) prefer single-line KDoc or // comments over multi-line /** */ blocks, (c) avoid '\\' where string concatenation or unicode escapes work. The lead station-repairs any residual damage; the gate re-verifies."

