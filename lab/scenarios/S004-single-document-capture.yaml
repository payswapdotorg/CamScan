# migrated to DSL v0.1 (typed meta.requires + explicit timeouts); previous requires: ['gui', 'adb', 'camera_fixture']
id: single-document-capture
title: Single-document capture end-to-end
status: UNKNOWN
preconditions:
- fresh-install
- camera-permission-granted
fixture:
  camera: clean-a4
steps:
- launch
- 'tap: scan'
- capture
- accept-document
- save
assertions:
  behavior:
  - document-detected
  - crop-stage-visible
  - save-succeeds
  ui:
  - scan-control-visible
  - preview-visible
  state:
  - document-added-to-library
  output:
  - pdf-created
  - pdf-readable
  - one-page-document
meta:
  timeout_seconds: 2400
  step_timeout_seconds: 180
  requires:
    gui: true
    adb: true
    android_emulator: true
    emulator_acceleration:
      allowed:
      - none
    camera_fixture: true
  owner: lead
  notes: Provisional spec from the mission's starting list — pending reference discovery
    (Worker 2). Status stays UNKNOWN until observed against CamScanner; actual reference
    behavior may differ.
