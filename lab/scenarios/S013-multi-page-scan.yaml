# migrated to DSL v0.1 (typed meta.requires + explicit timeouts); previous requires: ['gui', 'adb', 'camera_fixture']
id: multi-page-scan
title: Multi-page document scan
status: UNKNOWN
preconditions:
- camera-permission-granted
fixture:
  camera: multi-page
steps:
- launch
- 'tap: scan'
- capture
- capture
- capture
- done
- save
assertions:
  behavior:
  - additional-captures-append-pages
  - page-count-matches-captures
  ui:
  - page-count-indicator-visible
  state:
  - document-added-to-library
  output:
  - pdf-page-count-equals-captures
meta:
  timeout_seconds: 3000
  step_timeout_seconds: 180
  requires:
    gui: true
    adb: true
    android_emulator: true
    emulator_acceleration:
      allowed:
      - none
    camera_fixture: true
  owner: lead
  notes: Provisional spec from the mission's starting list — pending reference discovery
    (Worker 2). Status stays UNKNOWN until observed against CamScanner; actual reference
    behavior may differ.
