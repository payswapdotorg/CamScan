# migrated to DSL v0.1 (typed meta.requires + explicit timeouts); previous requires: ['gui', 'adb', 'camera_fixture']
id: manual-crop
title: Manual crop adjustment
status: UNKNOWN
preconditions:
- camera-permission-granted
fixture:
  camera: skewed-document
steps:
- launch
- 'tap: scan'
- capture
- adjust-crop
- confirm
assertions:
  behavior:
  - crop-handles-movable
  - crop-applies-to-preview
  ui:
  - crop-handles-visible
  state: []
  output:
  - cropped-output-reflects-adjustment
meta:
  timeout_seconds: 2400
  step_timeout_seconds: 180
  requires:
    gui: true
    adb: true
    android_emulator: true
    emulator_acceleration:
      allowed:
      - none
    camera_fixture: true
  owner: lead
  notes: Provisional spec from the mission's starting list — pending reference discovery
    (Worker 2). Status stays UNKNOWN until observed against CamScanner; actual reference
    behavior may differ.
