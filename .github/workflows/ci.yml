name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-plane-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Scenario DSL + ledger consistency + manifest integrity
        run: python3 tools/lab-cli/validate.py
        # gates: typed meta.requires + timeouts, ledger JSON-Schema + mirrors,
        # fixture refs/hashes, capability reports (e2b must report accel none)
      # app/ build gates are added by CAMSCAN-001 (gradle assembleDebug,
      # unit tests, lint) — interactive Android execution is NEVER forced
      # into CI (no KVM on hosted runners); it belongs to a LabProvider.

  android-skeleton:
    name: android skeleton gates (assemble / unit / lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: assembleDebug + testDebugUnitTest + lintDebug
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace
